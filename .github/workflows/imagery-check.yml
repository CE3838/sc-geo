name: External services check

# Checks that depend on outside services: the NAIP imagery servers and the
# viewer running with MapLibre from unpkg. Kept separate from CI so an
# outage elsewhere does not block unrelated changes.
on:
  pull_request:
    paths: ["web/**", "scripts/**", ".github/workflows/imagery-check.yml"]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check_imagery.mjs

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/viewer_smoke.mjs
        env:
          SMOKE_LOG_SCREENSHOTS: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: viewer-*.png
          if-no-files-found: ignore
