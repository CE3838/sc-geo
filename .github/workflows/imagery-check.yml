name: External services check

# Checks that depend on outside services: the NAIP imagery servers, the USGS
# SGMC geology service, and the viewer running with MapLibre from unpkg. Kept separate from CI so an
# outage elsewhere does not block unrelated changes.
on:
  pull_request:
    paths: ["web/**", "scripts/**", "harvest/**", "config/**", "merge/**", "model/**", ".github/workflows/imagery-check.yml"]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check_imagery.mjs

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harvest SGMC geology
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m harvest.sgmc
      - uses: actions/cache@v4
        with:
          path: .cache/normalized
          key: normalized-${{ hashFiles('merge/**', 'model/**', 'data/catalog/sc_catalog.json') }}
          restore-keys: normalized-
      - name: Build merged geology
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          pip install "shapely>=2"
          python -m merge.build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/viewer_smoke.mjs
        env:
          SMOKE_LOG_SCREENSHOTS: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: viewer-*.png
          if-no-files-found: ignore
