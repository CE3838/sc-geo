name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install "pytest>=8" "shapely>=2"
      - run: python -m pytest
      - run: node --test "tests/web/*.test.mjs"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # publish the data package release
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Keep the last good geology data so a USGS outage doesn't drop it.
      - uses: actions/cache@v4
        with:
          path: |
            web/data/geology
            .checkpoints/sgmc
            .cache/normalized
          key: sgmc-${{ github.run_id }}
          restore-keys: sgmc-
      - name: Harvest SGMC geology
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m harvest.sgmc
      - name: Build merged geology (all GIS sources)
        continue-on-error: true
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          pip install "shapely>=2"
          python -m merge.build
      - name: Check geology data
        run: |
          if [ -s web/data/geology/sgmc-sc.geojson ]; then
            ls -l web/data/geology
            test -s web/data/geology/merged-surficial.geojson || echo "::warning::No merged geology; the viewer falls back to SGMC"
          else
            echo "::warning::No geology data; deploying without it"
          fi
      - name: Pack the public data package
        id: package
        if: hashFiles('web/data/geology/merged-surficial.geojson') != ''
        run: python -m merge.package --out sc-geo-data.zip
      # The desktop app (private repo) bundles the newest data-* release.
      - name: Publish the data package release
        if: steps.package.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$TAG" sc-geo-data.zip --target "$GITHUB_SHA" --latest \
            --title "Public data $TAG" \
            --notes "Merged surficial and bedrock geology, SGMC, source catalog, Geolex lexicon and the SC outline, built from ${GITHUB_SHA}. manifest.json lists each file with its SHA-256."
          # Keep the 10 newest data packages.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^data-' | sort -r | tail -n +11 |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
