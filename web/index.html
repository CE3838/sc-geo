<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>South Carolina Geology Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button type="button" id="panels-toggle" class="header-button" aria-controls="panels" aria-expanded="false">Layers</button>
    <h1 class="app-title">South Carolina Geology Viewer</h1>
    <span class="app-subtitle">South Carolina Geology · Public Data</span>
    <a class="app-link" href="https://github.com/CE3838/sc-geo" target="_blank" rel="noopener noreferrer">Sources</a>
  </header>
  <main class="app-main">
    <aside id="panels" class="sidebar" aria-label="Layers and map units"></aside>
    <div id="map" role="region" aria-label="Map of South Carolina"></div>
    <aside id="card" class="card" aria-label="Property card" hidden></aside>
    <div id="imagery-notice" role="status" hidden>Aerial imagery is unavailable right now. Try again later.</div>
  </main>
  <footer class="status-bar" aria-label="Cursor position">
    <span class="status-item"><span class="status-label" id="status-sp-label">SC State Plane</span> <span id="status-sp">–</span></span>
    <span class="status-item status-ll"><span id="status-ll">–</span></span>
    <span class="status-item"><span class="status-label">Scale</span> <span id="status-scale">–</span></span>
    <span class="status-item status-note">Cited public data, provided as is, without warranty</span>
  </footer>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
